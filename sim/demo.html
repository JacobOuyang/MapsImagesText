<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuZip Demo</title>
<style>
  :root { --bg:#0f1419; --line:#2a3540; --fg:#e8edf2; --quiet:#8b98a5; --accent:#f59f00; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--line); background:#0b1015; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; } header .sub { color:var(--quiet); }
  .grow { flex:1; }
  .scenes { display:flex; gap:6px; }
  button { font:inherit; color:var(--fg); background:#25313c; border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#111; font-weight:650; }
  #next { border-radius:8px; font-weight:650; }
  #step { color:var(--quiet); font-variant-numeric:tabular-nums; min-width:90px; text-align:right; }
  main { flex:1; position:relative; min-height:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); display:none; }
  iframe.on { display:block; }
  .caption { padding:14px 26px 16px; border-top:1px solid var(--line); background:#0b1015; font-size:21px; line-height:1.35; min-height:74px; }
  .caption small { display:block; color:var(--quiet); font-size:13px; margin-top:4px; }
  body.clean .caption { display:none; }
</style>
</head>
<body>
<header>
  <h1>MuZip</h1><span class="sub">Agentic compression: Muse asks for the parts of a photo it needs; the photo stays where it was taken.</span>
  <div class="grow"></div>
  <div class="scenes" id="scenes"></div>
  <span id="step"></span><button id="next" title="→ or space">Next ▸</button>
</header>
<main id="main"></main>
<div class="caption" id="caption"></div>
<script>
// The video's stage, scene by scene. → / space: next step; 1-4: jump to a scene; C: hide the captions (record clean,
// add the voice-over from demo/SCRIPT.md later). Each scene is one of the simulator's pages in a frame; a step either
// loads it (go), shows another photo in /compare (photo), or steps /group (group).
const $ = id => document.getElementById(id);
const Q = s => encodeURIComponent(s);
const LIGHTS = 'Two warning lights came on on my dashboard. Which ones are they, and what do they mean?';
const SIGN = 'There are people on a roof. What does the sign next to them say?';
const SCENES = [
  {name: 'Three ways', src: '/compare?photo=dashboard&demo=1', steps: [
    {say: 'Two warning lights came on. Which ones, and what do they mean? Sent the normal way, the photo is 214 KB.',
     note: 'Every answer on this page is Muse Spark\'s, judged against the truth, five runs each.'},
    {say: 'Squeezed to 3 KB with classical compression, Muse can\'t tell which lights they are.',
     note: 'WebP got its best shot: every size and quality that fits, in colour and grey.'},
    {say: 'MuZip sends the same 3 KB, 74 times smaller: the battery light and the check-engine light. Five times out of five.',
     note: 'Classical compression keeps what you\'d notice. MuZip keeps what the question needs.'},
    {photo: 'medicine_headache', say: 'A cabinet of look-alike bottles: which one is for a headache? Classical compression says take the Tylenol. There is no Tylenol.'},
    {photo: 'almond_milk', say: 'On a real photo of a supermarket aisle: is there almond milk? Which brand?'},
    {photo: 'extinguisher', say: 'And on a corridor: can I use this fire extinguisher? Classical compression says yes. It\'s empty.'}]},
  {name: 'Look closer', src: '', steps: [
    {go: '/closer?sample=hard/dashboard&auto=1&q=' + Q(LIGHTS),
     say: 'How it works. The phone sends the question and a 128-pixel grey sketch: about ten texts.',
     note: 'Muse Spark sees only the sketch. The full photo stays on the phone.'},
    {say: 'Muse asks for the instrument cluster, in colour: red and amber matter here. Then each light on its own. The phone crops its own photo and sends it back by itself.',
     note: 'SAM 3.1 outlines the thing Muse asked about in each close-up; Muse is told where it is in the whole photo.'},
    {say: 'Each light comes back at the photo\'s own pixels, by itself: the battery light and the check-engine light. The photo never left the phone.',
     note: 'Each close-up is only the part Muse asked for.'}]},
  {name: 'Group chat', src: '/group', steps: [
    {say: 'A neighbourhood group chat on a stormy night. Ana shares a photo of her street: the group gets MuZip\'s sketch.',
     note: 'Simulated WhatsApp; the loop, Muse Spark and SAM 3.1 are real.'},
    {group: true, say: 'Ben asks Muse what the little sign says. Muse asks Ana\'s phone for close-ups of the sign.',
     note: 'The original never leaves Ana\'s phone; her phone answers the requests by itself.'},
    {group: true, say: 'Chen asks which warehouse it is. Same photo, a different question: different close-ups.',
     note: 'That is what makes it semantic: what gets sent depends on the question.'}]},
  {name: 'Drone', src: '', steps: [
    {go: '/closer?device=drone&sample=field/drone_sign&auto=1&q=' + Q(SIGN),
     say: 'The same loop on a drone over a flood, sending over a thin radio link. People on a roof, and a sign.',
     note: 'The drone keeps its full photo; the operator\'s Muse asks for the part it needs.'},
    {say: 'NEED INSULIN, 2 PEOPLE. Read from a sketch and two close-ups.',
     note: 'Anywhere the picture is big and the link is thin: drones, remote cameras, satellite messengers.'}]},
];
let scene = 0, step = -1;
const frames = SCENES.map(s => { const f = document.createElement('iframe'); f.title = s.name; $('main').appendChild(f); return f; });

function show() {
  frames.forEach((f, i) => f.classList.toggle('on', i === scene));
  const st = SCENES[scene].steps[step];
  $('caption').innerHTML = st ? st.say + (st.note ? '<small>' + st.note + '</small>' : '') : '<small>Press → to start: ' + SCENES[scene].name + '</small>';
  $('step').textContent = 'Step ' + Math.max(step + 1, 0) + ' / ' + SCENES[scene].steps.length;
  $('scenes').innerHTML = '';
  SCENES.forEach((s, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + s.name; b.className = i === scene ? 'on' : '';
    b.onclick = () => enter(i); $('scenes').appendChild(b); });
}
function run(st) {
  const f = frames[scene];
  if (st.go) f.src = st.go;
  if (st.photo) f.contentWindow.postMessage({photo: st.photo}, '*');
  if (st.group) f.contentWindow.postMessage({next: true}, '*');
}
function next() {
  const steps = SCENES[scene].steps;
  if (step + 1 >= steps.length) { if (scene + 1 < SCENES.length) enter(scene + 1); return; }
  step++; show(); run(steps[step]);
}
function enter(i) {
  scene = i; step = -1;
  if (SCENES[i].src) frames[i].src = SCENES[i].src;  // fresh: a group chat starts over, /compare on its first photo
  show();
}
$('next').onclick = next;
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= SCENES.length) enter(+e.key - 1);
  else if (e.key === 'c' || e.key === 'C') document.body.classList.toggle('clean');
});
enter(0);
</script>
</body>
</html>
