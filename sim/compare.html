<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Ways</title>
<style>
  :root { --bg:#0f1419; --panel:#161d24; --line:#2a3540; --fg:#e8edf2; --quiet:#8b98a5; --accent:#f59f00; --good:#40c057; --bad:#fa5252; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid var(--line); background:#0b1015; flex-wrap:wrap; }
  header h1 { font-size:22px; margin:0; } .grow { flex:1; }
  .tabs { display:flex; gap:6px; }
  button { font:inherit; color:var(--fg); background:#25313c; border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#111; font-weight:650; }
  .q { padding:16px 26px 0; font-size:26px; } .q span { color:var(--quiet); font-size:16px; margin-left:10px; }
  main { flex:1; display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; padding:16px 26px 22px; min-height:0; }
  .col { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .col h2 { margin:0; font-size:20px; } .col .how { color:var(--quiet); font-size:14px; margin-top:-6px; }
  .pic { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#0b1015; border-radius:10px; overflow:hidden; position:relative; }
  .pic img { max-width:100%; max-height:100%; display:block; }
  .pic img.px { image-rendering:pixelated; width:100%; height:100%; object-fit:contain; }
  .strip { display:flex; gap:8px; } .strip figure { margin:0; flex:1; min-width:0; }
  .strip img { width:100%; aspect-ratio:1; object-fit:contain; background:#0b1015; border-radius:6px; display:block; }
  .strip figcaption { font-size:12px; color:var(--quiet); margin-top:2px; }
  .size { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; } .size small { font-size:16px; color:var(--quiet); font-weight:400; margin-left:6px; }
  .answer { font-size:18px; border-left:4px solid var(--line); padding:4px 0 4px 12px; min-height:3.2em; }
  .answer.right { border-color:var(--good); } .answer.wrong { border-color:var(--bad); } .answer.unsure { border-color:var(--accent); }
  .score { font-size:15px; } .score b { font-size:18px; }
  .score .right { color:var(--good); } .score .wrong { color:var(--bad); } .score .unsure { color:var(--accent); }
  .foot { padding:0 26px 14px; color:var(--quiet); font-size:13px; }
  .empty { margin:auto; color:var(--quiet); font-size:18px; }
</style>
</head>
<body>
<header>
  <h1>One photo, one question, three ways</h1>
  <div class="grow"></div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="q" id="q"></div>
<main id="main"><div class="empty">Run evals/kit/three_ways.py first.</div></main>
<div class="foot" id="foot"></div>
<script>
// The three-way comparison (evals/kit/three_ways.py) for recording: the full photo, classical compression (WebP)
// squeezed into what MuZip used, and MuZip. Every number and answer is from the measured runs.
// → or space: next photo; 1-3: a photo; ?photo=extinguisher opens one (/demo also sends {photo}).
const $ = id => document.getElementById(id);
const esc = t => String(t || '').replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const kb = b => b < 1000 ? b + ' B' : b < 1e6 ? (b / 1000).toFixed(1) + ' KB' : (b / 1e6).toFixed(2) + ' MB';
let rows = [], at = 0;

function kind(r) { return r.verdict !== 'right' ? (r.verdict === 'not sure' ? 'unsure' : 'wrong') : r.sure === 'yes' ? 'right' : 'unsure'; }  // judged against the reference
function typical(runs, truth) {  // the answer most runs gave (by how it came out), so the panel shows the usual case
  const n = {}; for (const r of runs) n[kind(r)] = (n[kind(r)] || 0) + 1;
  const top = Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  return runs.find(r => kind(r) === top);
}
function score(way, runs, truth) {
  const wrong = runs.filter(r => kind(r) === 'wrong').length, unsure = runs.length - way.right - wrong;
  return `Muse, ${runs.length} runs: <b class="right">${way.right} sure and right</b>` + (unsure ? ` · <span class="unsure">${unsure} unsure</span>` : '') +
         (wrong ? ` · <span class="wrong">${wrong} wrong</span>` : '');
}
function col(title, how, picture, size, texts, way, runs, truth, answer) {
  const a = answer || typical(runs, truth);
  return `<section class="col"><h2>${title}</h2><div class="how">${how}</div>${picture}
    <div class="size">${size}<small>${texts.toLocaleString()} text${texts > 1 ? 's' : ''}</small></div>
    <div class="answer ${kind(a)}">“${esc(a.answer.split('\n')[0])}”</div><div class="score">${score(way, runs, truth)}</div></section>`;
}
function show() {
  const r = rows[at]; if (!r) return;
  $('tabs').innerHTML = rows.map((x, i) => `<button class="${i === at ? 'on' : ''}" onclick="go(${i})">${i + 1} ${esc(x.name.replace(/_/g, ' '))}</button>`).join('');
  $('q').innerHTML = `“${esc(r.question)}”<span>The answer: ${esc(r.truth)}</span>`;
  const f = r.full, w = r.webp, m = r.muzip, best = m.runs.find(x => x.answer === m.answer) || m.runs[0];
  $('main').innerHTML =
    col('The photo itself', 'Sent the normal way', `<div class="pic"><img src="/samples/${r.sample}.jpg" alt="the full photo"></div>`,
        kb(f.bytes), f.texts, f, f.runs, r.truth) +
    col('Classical compression', `The whole photo as WebP (${w.side} px, ${w.colour ? 'colour' : 'grey'}, quality ${w.quality}), squeezed into MuZip's size`,
        `<div class="pic"><img class="px" src="/eval/three_ways/${w.image}" alt="the WebP Muse got"></div>`, kb(w.bytes), w.texts, w, w.runs, r.truth) +
    col('MuZip', 'A 128 px grey picture, then only the close-ups Muse asks for. The photo stays on the phone.',
        `<div class="pic"><img class="px" src="/eval/three_ways/${m.views[m.views.length - 1].image}" alt="MuZip's last close-up"></div>
         <div class="strip">${m.views.map(v => `<figure><img class="px" src="/eval/three_ways/${v.image}" alt="${esc(v.label)}"><figcaption>${esc(v.label)}</figcaption></figure>`).join('')}</div>`,
        kb(best.bytes), best.texts, m, m.runs, r.truth, best);  // the run whose pictures are shown
  $('foot').textContent = 'Measured by evals/kit/three_ways.py: each way asked ' + f.runs.length + ' times; "sure and right" = the true answer, and Muse said it was sure. ' +
    'WebP got its best shot at MuZip\'s median size (' + kb(m.bytes) + '): every width and quality that fits, colour and grey. MuZip shows one of its runs.';
}
function go(i) { at = (i + rows.length) % rows.length; show(); }
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(at + 1); }
  else if (e.key === 'ArrowLeft') go(at - 1);
  else if (/^[1-9]$/.test(e.key) && +e.key <= rows.length) go(+e.key - 1);
});
addEventListener('message', e => { const i = rows.findIndex(r => r.name === (e.data || {}).photo); if (i >= 0) go(i); });  // from /demo
fetch('/api/compare').then(r => r.json()).then(d => {
  rows = d.rows || []; const p = new URLSearchParams(location.search).get('photo');  // ?photo=extinguisher
  at = Math.max(0, rows.findIndex(r => r.name === p)); if (rows.length) show();
});
</script>
</body>
</html>
